stages:
  - verify
  - build
  - deploy

variables:
  DOCKER_REGISTRY: "registry.chexnet.vn"
  APP_NAME: "chexnet-be"
  STAGING_IMAGE: "$DOCKER_REGISTRY/$APP_NAME:staging"
  PRODUCTION_IMAGE: "$DOCKER_REGISTRY/$APP_NAME:latest"

# ── Stage 1: Verify ─────────────────────────────────────────────────────────
check_lint:
  stage: verify
  image: node:20-alpine
  script:
    - yarn install --pure-lockfile
    - yarn lint
  only:
    - merge_requests
    - develop
    - production

check_types:
  stage: verify
  image: node:20-alpine
  script:
    - yarn install --pure-lockfile
    - yarn build
  only:
    - merge_requests
    - develop
    - production

# ── Stage 2: Build ──────────────────────────────────────────────────────────
build_staging:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $DOCKER_REGISTRY
    - docker build -t $STAGING_IMAGE .
    - docker push $STAGING_IMAGE
  only:
    - develop

build_production:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $DOCKER_REGISTRY
    - docker build -t $PRODUCTION_IMAGE .
    - docker push $PRODUCTION_IMAGE
  only:
    - production

# ── Stage 3: Deploy ─────────────────────────────────────────────────────────
deploy_staging:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh -o StrictHostKeyChecking=no deploy@staging.chexnet.vn "cd /apps/chexnet-be && docker-compose pull && docker-compose up -d"
  environment:
    name: staging
    url: https://staging.chexnet.vn
  only:
    - develop
  dependencies: []

deploy_production:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh -o StrictHostKeyChecking=no deploy@chexnet.vn "cd /apps/chexnet-be && docker-compose pull && docker-compose up -d"
  environment:
    name: production
    url: https://chexnet.vn
  when: manual
  only:
    - production
  dependencies: []
